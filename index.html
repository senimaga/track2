<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Tracker de Hábitos</title>
  <link rel="stylesheet" href="style.css?v=20260811-3">
</head>
<body>
  <div id="habits-screen">
    <h1>📝 Mis Hábitos</h1>
    <div id="add-task-container">
      <input type="text" id="new-task" placeholder="Nuevo hábito">
      <button id="add-btn">Añadir</button>
    </div>
    <ul id="task-list"></ul>
  </div>

  <div id="calendar-screen" style="display:none;">
    <div id="month-navigation">
      <button id="prev-month" class="month-btn" aria-label="Mes anterior">‹</button>
      <h2 id="month-name"></h2>
      <button id="next-month" class="month-btn" aria-label="Mes siguiente">›</button>
    </div>

    <h3 id="calendar-title"></h3>
    <button id="today-btn">Ir a este mes</button>

    <div id="week-days">
      <div>L</div>
      <div>M</div>
      <div>X</div>
      <div>J</div>
      <div>V</div>
      <div>S</div>
      <div>D</div>
    </div>

    <div id="calendar"></div>
    <button id="back-btn">← Volver a hábitos</button>
  </div>

  <script src="script.js?v=20260811-3"></script>
</body>
</html>
