<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fdf6f0">
  <title>Mi Tracker de Hábitos</title>
  <link rel="stylesheet" href="style.css?v=20260812-7">
</head>
<body>
  <div id="auth-screen" class="auth-card">
    <h1>📝 Mis Hábitos</h1>
    <p class="auth-subtitle">Inicia sesión para sincronizar tus hábitos en todos tus dispositivos.</p>
    <div class="auth-form">
      <input type="email" id="auth-email" placeholder="Correo electrónico" autocomplete="username">
      <input type="password" id="auth-password" placeholder="Contraseña" autocomplete="current-password">
      <div class="auth-actions">
        <button id="login-btn">Iniciar sesión</button>
        <button id="signup-btn" class="secondary-btn">Crear cuenta</button>
      </div>
      <p id="auth-message" aria-live="polite"></p>
    </div>
  </div>

  <div id="app-shell" style="display:none;">
    <div class="account-bar">
      <span id="user-email"></span>
      <span id="sync-status">☁️ Sincronizado</span>
      <button id="logout-btn">Cerrar sesión</button>
    </div>

    <div id="categories-screen">
      <h1>📂 Mis categorías</h1>
      <div id="add-category-container">
        <input type="text" id="new-category" placeholder="Nueva categoría">
        <button id="add-category-btn">Añadir categoría</button>
      </div>
      <div id="category-list"></div>
    </div>

    <div id="category-screen" style="display:none;">
      <button id="back-categories-btn" class="back-link">← Categorías</button>
      <h1 id="category-screen-title"></h1>
      <div id="add-task-container">
        <input type="text" id="new-task" placeholder="Nuevo hábito">
        <button id="add-btn">Añadir</button>
      </div>
      <ul id="task-list"></ul>
    </div>

    <div id="calendar-screen" style="display:none;">
      <div id="month-navigation">
        <button id="prev-month" class="month-btn" aria-label="Mes anterior">‹</button>
        <h2 id="month-name"></h2>
        <button id="next-month" class="month-btn" aria-label="Mes siguiente">›</button>
      </div>

      <h3 id="calendar-title"></h3>

      <div id="habit-note-storage" hidden>
        <input type="text" id="habit-note">
        <button id="save-note-btn">Guardar nota</button>
      </div>

      <button id="today-btn">Ir a este mes</button>

      <div id="week-days">
        <div>L</div><div>M</div><div>X</div><div>J</div><div>V</div><div>S</div><div>D</div>
      </div>

      <div id="calendar"></div>
      <button id="back-btn">← Volver a la categoría</button>

      <div id="habit-note-display-container">
        <p id="habit-note-display">Sin nota</p>
        <button id="edit-note-btn" aria-label="Editar nota" title="Editar nota">✏️</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js?v=20260812-7"></script>
  <script type="module" src="note-ui.js?v=20260812-7"></script>
</body>
</html>
